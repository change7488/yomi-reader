name: Android ARM64 APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/first-run-onboarding
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - name: Install dependencies and verify shared modules
        run: |
          npm ci
          npm run check
      - name: Build installable ARM64 debug APK
        run: npm run android:apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomi-Reader-Android-arm64-debug
          path: release/Yomi-Reader-Android-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
